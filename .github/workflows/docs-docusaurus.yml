name: Docusaurus documentation

on:
  pull_request:
    paths:
      - 'docs/**'
      - 'documentation-site/**'
      - 'scripts/documentation/**'
      - '.github/workflows/docs-docusaurus.yml'
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'documentation-site/**'
      - 'scripts/documentation/**'
      - '.github/workflows/docs-docusaurus.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: documentation-site/.nvmrc
          cache: npm
          cache-dependency-path: documentation-site/package-lock.json

      - name: Install documentation dependencies
        working-directory: documentation-site
        run: npm ci

      - name: Validate Markdown source
        run: scripts/documentation/validate-docs.sh

      - name: Type-check site
        working-directory: documentation-site
        run: npm run typecheck

      - name: Build site
        working-directory: documentation-site
        env:
          DOCS_URL: https://${{ github.repository_owner }}.github.io
          DOCS_BASE_URL: /${{ github.event.repository.name }}/
          DOCS_ORGANIZATION: ${{ github.repository_owner }}
          DOCS_PROJECT_NAME: ${{ github.event.repository.name }}
          DOCS_REPOSITORY_URL: https://github.com/${{ github.repository }}
        run: npm run build

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: documentation-site/build

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
