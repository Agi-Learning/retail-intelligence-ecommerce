<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1220" viewBox="0 0 1680 1220" role="img" aria-labelledby="title desc">
  <title id="title">Retail Intelligence Platform end-to-end architecture</title>
  <desc id="desc">Web-only React micro-frontends call BFFs and Spring Boot microservices. Transactional outbox and Debezium publish through Kafka or Event Hubs into an Azure Databricks data mesh. Governed products serve analytics, machine learning, RAG and bounded agents. All operational changes return through governed domain APIs.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <marker id="feedback" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b45309"/>
    </marker>
    <style>
      .title { font: 700 30px Inter, Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 16px Inter, Arial, sans-serif; fill: #475569; }
      .layer-title { font: 700 17px Inter, Arial, sans-serif; fill: #0f172a; }
      .box-title { font: 700 15px Inter, Arial, sans-serif; fill: #0f172a; text-anchor: middle; }
      .box-text { font: 400 13px Inter, Arial, sans-serif; fill: #334155; text-anchor: middle; }
      .control-title { font: 700 18px Inter, Arial, sans-serif; fill: #ffffff; text-anchor: middle; }
      .control-text { font: 500 14px Inter, Arial, sans-serif; fill: #e0f2fe; text-anchor: middle; }
      .note { font: 600 14px Inter, Arial, sans-serif; fill: #92400e; text-anchor: middle; }
      .flow { stroke: #334155; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
      .flow-dash { stroke: #64748b; stroke-width: 2; stroke-dasharray: 7 6; fill: none; marker-end: url(#arrow); }
      .feedback-line { stroke: #b45309; stroke-width: 3; fill: none; marker-end: url(#feedback); }
      .layer { stroke: #cbd5e1; stroke-width: 1.5; rx: 18; }
      .box { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.5; rx: 12; }
    </style>
  </defs>

  <rect width="1680" height="1220" fill="#f8fafc"/>
  <text x="40" y="48" class="title">Retail Intelligence Platform — End-to-End Architecture</text>
  <text x="40" y="76" class="subtitle">React/TypeScript MFEs · Spring Boot microservices · Kafka/Event Hubs · Azure Databricks data mesh · ML, RAG and governed agents</text>

  <rect x="35" y="105" width="1275" height="125" class="layer" fill="#eef2ff"/>
  <text x="55" y="132" class="layer-title">1. Web experience</text>
  <rect x="205" y="145" width="235" height="62" class="box"/>
  <text x="322" y="170" class="box-title">React web shell</text>
  <text x="322" y="191" class="box-text">routing · identity · flags · telemetry</text>
  <rect x="540" y="145" width="590" height="62" class="box"/>
  <text x="835" y="170" class="box-title">Domain micro-frontends</text>
  <text x="835" y="191" class="box-text">account · catalog/search · cart/checkout · orders · support · admin</text>
  <path d="M 440 176 L 540 176" class="flow"/>

  <rect x="35" y="250" width="1275" height="125" class="layer" fill="#ecfeff"/>
  <text x="55" y="277" class="layer-title">2. Edge, identity and experience APIs</text>
  <rect x="175" y="295" width="245" height="60" class="box"/>
  <text x="297" y="320" class="box-title">Front Door, CDN and WAF</text>
  <text x="297" y="341" class="box-text">TLS · CSP · bot and rate controls</text>
  <rect x="520" y="295" width="225" height="60" class="box"/>
  <text x="632" y="320" class="box-title">Microsoft Entra ID</text>
  <text x="632" y="341" class="box-text">OIDC · PKCE · roles and claims</text>
  <rect x="845" y="295" width="285" height="60" class="box"/>
  <text x="987" y="320" class="box-title">API Management and BFFs</text>
  <text x="987" y="341" class="box-text">shopper · admin · contracts · policy</text>
  <path d="M 835 207 L 835 240 L 297 240 L 297 295" class="flow"/>
  <path d="M 420 325 L 845 325" class="flow"/>
  <path d="M 745 325 L 845 325" class="flow-dash"/>

  <rect x="35" y="395" width="1275" height="165" class="layer" fill="#f0fdf4"/>
  <text x="55" y="425" class="layer-title">3. Operational commerce — systems of record</text>
  <rect x="100" y="445" width="185" height="82" class="box"/>
  <text x="192" y="472" class="box-title">Customer</text>
  <text x="192" y="494" class="box-text">identity · consent</text>
  <text x="192" y="513" class="box-text">profile · address</text>
  <rect x="315" y="445" width="185" height="82" class="box"/>
  <text x="407" y="472" class="box-title">Product</text>
  <text x="407" y="494" class="box-text">catalog · pricing</text>
  <text x="407" y="513" class="box-text">promotion · search</text>
  <rect x="530" y="445" width="220" height="82" class="box"/>
  <text x="640" y="472" class="box-title">Commerce and payment</text>
  <text x="640" y="494" class="box-text">cart · checkout · order</text>
  <text x="640" y="513" class="box-text">payment · return · refund</text>
  <rect x="780" y="445" width="185" height="82" class="box"/>
  <text x="872" y="472" class="box-title">Supply</text>
  <text x="872" y="494" class="box-text">inventory · warehouse</text>
  <text x="872" y="513" class="box-text">fulfillment · delivery</text>
  <rect x="995" y="445" width="205" height="82" class="box"/>
  <text x="1097" y="472" class="box-title">Engagement</text>
  <text x="1097" y="494" class="box-text">CMS · CRM · notification</text>
  <text x="1097" y="513" class="box-text">support · clickstream</text>
  <text x="655" y="548" class="subtitle" text-anchor="middle">Spring Boot · service-owned PostgreSQL/Flyway · Redis/OpenSearch/object projections</text>
  <path d="M 987 355 L 987 382 L 640 382 L 640 445" class="flow"/>

  <rect x="35" y="580" width="1275" height="155" class="layer" fill="#fff7ed"/>
  <text x="55" y="610" class="layer-title">4. Reliable event and ingestion platform</text>
  <rect x="95" y="628" width="205" height="78" class="box"/>
  <text x="197" y="656" class="box-title">Transactional outbox</text>
  <text x="197" y="678" class="box-text">atomic with domain state</text>
  <rect x="360" y="628" width="205" height="78" class="box"/>
  <text x="462" y="656" class="box-title">Debezium and Connect</text>
  <text x="462" y="678" class="box-text">CDC · offsets · schema history</text>
  <rect x="625" y="628" width="210" height="78" class="box"/>
  <text x="730" y="656" class="box-title">Kafka or Event Hubs</text>
  <text x="730" y="678" class="box-text">contracts · replay · quarantine</text>
  <rect x="895" y="628" width="155" height="78" class="box"/>
  <text x="972" y="656" class="box-title">Azure Data Factory</text>
  <text x="972" y="678" class="box-text">batch · APIs · SaaS</text>
  <rect x="1110" y="628" width="155" height="78" class="box"/>
  <text x="1187" y="656" class="box-title">ADLS raw landing</text>
  <text x="1187" y="678" class="box-text">lossless archive</text>
  <path d="M 640 527 L 640 570 L 197 570 L 197 628" class="flow"/>
  <path d="M 300 667 L 360 667" class="flow"/>
  <path d="M 565 667 L 625 667" class="flow"/>
  <path d="M 835 667 L 865 667 L 865 615 L 1187 615 L 1187 628" class="flow"/>
  <path d="M 1050 667 L 1110 667" class="flow"/>
  <text x="972" y="721" class="box-text">external sources enter through governed connectors</text>

  <rect x="35" y="755" width="1275" height="195" class="layer" fill="#f5f3ff"/>
  <text x="55" y="785" class="layer-title">5. Azure Databricks lakehouse and data mesh</text>
  <rect x="90" y="812" width="200" height="92" class="box"/>
  <text x="190" y="840" class="box-title">Bronze products</text>
  <text x="190" y="862" class="box-text">lossless · append · replay</text>
  <text x="190" y="881" class="box-text">source and ingestion metadata</text>
  <rect x="350" y="812" width="200" height="92" class="box"/>
  <text x="450" y="840" class="box-title">Silver products</text>
  <text x="450" y="862" class="box-text">typed · CDC/SCD · quality</text>
  <text x="450" y="881" class="box-text">trusted domain state/history</text>
  <rect x="610" y="812" width="200" height="92" class="box"/>
  <text x="710" y="840" class="box-title">Gold products</text>
  <text x="710" y="862" class="box-text">facts · dimensions · KPIs</text>
  <text x="710" y="881" class="box-text">features and consumer marts</text>
  <rect x="870" y="812" width="360" height="92" class="box"/>
  <text x="1050" y="840" class="box-title">Domain product ownership</text>
  <text x="1050" y="862" class="box-text">Customer · Product · Commerce · Payment/Risk</text>
  <text x="1050" y="881" class="box-text">Supply · Engagement · Data/AI Platform</text>
  <path d="M 1187 706 L 1187 744 L 190 744 L 190 812" class="flow"/>
  <path d="M 290 858 L 350 858" class="flow"/>
  <path d="M 550 858 L 610 858" class="flow"/>
  <path d="M 810 858 L 870 858" class="flow"/>
  <text x="660" y="930" class="subtitle" text-anchor="middle">Lakeflow · Auto Loader · AUTO CDC · Delta · executable contracts · Unity Catalog · Microsoft Purview</text>

  <rect x="35" y="970" width="1275" height="155" class="layer" fill="#fdf2f8"/>
  <text x="55" y="1000" class="layer-title">6. Governed analytics, ML and AI consumption</text>
  <rect x="105" y="1022" width="225" height="72" class="box"/>
  <text x="217" y="1050" class="box-title">Analytics and BI</text>
  <text x="217" y="1072" class="box-text">Databricks SQL · Power BI</text>
  <rect x="390" y="1022" width="225" height="72" class="box"/>
  <text x="502" y="1050" class="box-title">ML and deep learning</text>
  <text x="502" y="1072" class="box-text">features · MLflow · serving</text>
  <rect x="675" y="1022" width="225" height="72" class="box"/>
  <text x="787" y="1050" class="box-title">RAG and AI Search</text>
  <text x="787" y="1072" class="box-text">ACL-aware · cited · evaluated</text>
  <rect x="960" y="1022" width="225" height="72" class="box"/>
  <text x="1072" y="1050" class="box-title">Bounded agents</text>
  <text x="1072" y="1072" class="box-text">typed tools · policy · approval</text>
  <path d="M 710 904 L 710 960 L 502 960 L 502 1022" class="flow"/>
  <path d="M 710 904 L 710 960 L 217 960 L 217 1022" class="flow"/>
  <path d="M 710 904 L 710 960 L 787 960 L 787 1022" class="flow"/>
  <path d="M 710 904 L 710 960 L 1072 960 L 1072 1022" class="flow"/>

  <rect x="1350" y="105" width="285" height="1020" rx="20" fill="#0f4c81" stroke="#082f49" stroke-width="2"/>
  <text x="1492" y="150" class="control-title">Cross-cutting control fabric</text>
  <text x="1492" y="200" class="control-text">Identity and least privilege</text>
  <text x="1492" y="245" class="control-text">API, event and product contracts</text>
  <text x="1492" y="290" class="control-text">Security and privacy</text>
  <text x="1492" y="335" class="control-text">Quality and reconciliation</text>
  <text x="1492" y="380" class="control-text">Lineage and catalog</text>
  <text x="1492" y="425" class="control-text">Observability and SLOs</text>
  <text x="1492" y="470" class="control-text">CI/CD and policy as code</text>
  <text x="1492" y="515" class="control-text">Resilience and disaster recovery</text>
  <text x="1492" y="560" class="control-text">FinOps and lifecycle</text>
  <text x="1492" y="625" class="control-text">Purview</text>
  <text x="1492" y="650" class="control-text">enterprise discovery and glossary</text>
  <text x="1492" y="700" class="control-text">Unity Catalog</text>
  <text x="1492" y="725" class="control-text">access, assets and lineage</text>
  <text x="1492" y="790" class="control-text">Data mesh principles</text>
  <text x="1492" y="820" class="control-text">domain ownership</text>
  <text x="1492" y="845" class="control-text">data as a product</text>
  <text x="1492" y="870" class="control-text">self-service platform</text>
  <text x="1492" y="895" class="control-text">federated governance</text>
  <text x="1492" y="965" class="control-text">AI controls</text>
  <text x="1492" y="995" class="control-text">evaluation · ACL · guardrails</text>
  <text x="1492" y="1020" class="control-text">approval · audit · kill switch</text>

  <path d="M 1185 1058 L 1285 1058 L 1285 314 L 1130 314" class="feedback-line"/>
  <rect x="1110" y="1128" width="485" height="58" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="1352" y="1153" class="note">Critical boundary: BI, ML, RAG and agents never write operational databases.</text>
  <text x="1352" y="1175" class="note">Every action returns through policy, BFF and the owning microservice API.</text>
</svg>
